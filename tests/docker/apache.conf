ServerName localhost
<VirtualHost *:8080>
    DocumentRoot /opt/chronos/webroot
    <Directory /opt/chronos/webroot>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # No fixture or container-configuration route is exposed over HTTP.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
