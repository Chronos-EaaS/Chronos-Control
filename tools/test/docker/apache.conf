ServerName localhost
<VirtualHost *:8080>
    ProxyPreserveHost On
    ProxyPass "/api/ui/live/ticket" "!"
    ProxyPass "/api/ui/live" "http://127.0.0.1:9081/api/ui/live" upgrade=websocket timeout=75
    ProxyPassReverse "/api/ui/live" "http://127.0.0.1:9081/api/ui/live"
    DocumentRoot /opt/chronos/webroot
    <Directory /opt/chronos/webroot>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Repository-local overrides must never expose processors or uploads.
    <Directory /opt/chronos/webroot/systems>
        AllowOverride None
        Options -Indexes -ExecCGI
    </Directory>
    <Directory /opt/chronos/webroot/data>
        AllowOverride None
        Options -Indexes -ExecCGI
    </Directory>
    <Directory /opt/chronos/webroot/media>
        AllowOverride None
        Options -Indexes -ExecCGI
    </Directory>
    <LocationMatch "^/(?:systems/[1-9][0-9]*/.+|data(?:/|$)|media(?:/|$))">
        Require all denied
    </LocationMatch>
    # No fixture or container-configuration route is exposed over HTTP.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
