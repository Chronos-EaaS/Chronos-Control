<main class="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <img class="login-logo" src="/chronos-logo.svg" width="216" height="144" alt="Chronos" />
    </div>
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Please sign in</h1>
      <app-feedback [error]="error()" />
      <form #form="ngForm" (ngSubmit)="signIn()">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="login-field">
            <input
              id="username"
              class="form-control"
              name="username"
              autocomplete="username"
              required
              [(ngModel)]="username"
              [disabled]="busy()"
            />
            <app-icon name="user" aria-hidden="true" />
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="login-field">
            <input
              id="password"
              class="form-control"
              type="password"
              name="password"
              autocomplete="current-password"
              required
              [(ngModel)]="password"
              [disabled]="busy()"
            />
            <app-icon name="key" aria-hidden="true" />
          </div>
        </div>
        <div class="login-actions">
          <div class="form-check">
            <input
              id="remember"
              class="form-check-input"
              type="checkbox"
              name="remember"
              [(ngModel)]="remember"
              [disabled]="busy()"
            /><label class="form-check-label" for="remember">Remember me</label>
          </div>
          <button class="btn btn-primary" type="submit" [disabled]="busy() || form.invalid">
            {{ busy() ? 'Signing in…' : 'Sign in' }}
          </button>
        </div>
      </form>
    </section>
    <p class="login-footer">
      <a href="https://chronos-eaas.org" target="_blank" rel="noopener noreferrer"
        >The Chronos Project</a
      >
      · Version {{ applicationVersion() ?? 'unavailable' }}
    </p>
  </div>
</main>
