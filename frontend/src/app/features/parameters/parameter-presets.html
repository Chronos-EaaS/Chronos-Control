<section class="card card-outline card-secondary parameter-presets">
  <div class="card-header">
    <h2 class="card-title">Named parameter presets</h2>
    <button class="btn btn-sm btn-outline-secondary" type="button" [disabled]="busy()" (click)="reload()">Refresh presets</button>
  </div>
  <div class="card-body">
    <app-feedback [busy]="busy()" [error]="error()" [success]="success()" />
    <div class="preset-fields">
      <div>
        <label class="form-label" for="parameter-preset">Saved preset</label>
        <select id="parameter-preset" class="form-select" [ngModelOptions]="{standalone:true}" [ngModel]="selectedId" (ngModelChange)="select($event)">
          <option value="">Select a preset</option>
          @for (preset of collection().items; track preset.id) {
            <option [value]="preset.id">{{ preset.name }}{{ preset.compatible ? '' : ' (schema changed)' }}</option>
          }
        </select>
      </div>
      <div>
        <label for="preset-name" class="form-label">Preset name</label>
        <input id="preset-name" class="form-control" [ngModelOptions]="{standalone:true}" [(ngModel)]="name" maxlength="100" />
      </div>
    </div>
    @if (selected(); as preset) {
      <p class="form-text mb-0">Updated {{ time(preset.updatedAt) }}.@if (!preset.compatible) { The schema has changed. Loading keeps the saved preset intact; review every current field before running. }</p>
    }
    <div class="preset-actions">
      <button type="button" class="btn btn-sm btn-primary" [disabled]="busy() || !selected()" (click)="load()">{{ selected()?.compatible === false ? 'Load for review' : 'Load preset' }}</button>
      <button type="button" class="btn btn-sm btn-outline-primary" [disabled]="busy() || !valid() || !name.trim() || !collection().schemaHash" (click)="save(false)">Save as new preset</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" [disabled]="busy() || !valid() || !name.trim() || !selected()" (click)="save(true)">Update selected preset</button>
      <button type="button" class="btn btn-sm btn-outline-danger" [disabled]="busy() || !selected()" (click)="remove()">Delete preset</button>
    </div>
  </div>
</section>
