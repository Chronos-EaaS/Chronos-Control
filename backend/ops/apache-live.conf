# Include inside the existing HTTPS VirtualHost after replacing the application origin.
# Requires Apache >=2.4.47 with proxy, proxy_http and headers enabled.
ProxyPreserveHost On
ProxyPass "/api/ui/live/ticket" "!"
ProxyPass "/api/ui/live" "http://127.0.0.1:9081/api/ui/live" upgrade=websocket timeout=75
ProxyPassReverse "/api/ui/live" "http://127.0.0.1:9081/api/ui/live"
<Location "/api/ui/live">
    RequestHeader set X-Forwarded-Proto "https"
</Location>
