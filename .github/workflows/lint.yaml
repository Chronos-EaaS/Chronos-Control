name: Lint PHP files

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  lint-files:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PHP
        run: sudo apt install -y php-cli

      - name: Run linter
        run: find backend tests/fixtures -path 'backend/vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
