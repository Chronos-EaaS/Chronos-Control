name: Legacy UI characterization (fixed v2 baseline)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    env:
      CHRONOS_TEST_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fca17c376eada06820c0b84c595a503194028931
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          cache: npm
      - name: Install locked browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Type-check browser tests
        run: npm run typecheck
      - name: Build and start isolated fixtures
        run: scripts/test-stack up
      - name: Run domain tests on the target PHP runtime
        run: >-
          docker compose --project-name chronos-v3-regression --file compose.test.yml
          exec -T web php -d allow_url_fopen=0 /opt/chronos/vendor/bin/phpunit
          --configuration /opt/chronos/phpunit.xml.dist --display-incomplete
      - name: Install browser engines
        if: matrix.php == '8.3'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run legacy UI and agent/CEM contracts
        if: matrix.php == '8.3'
        run: npm run test:e2e:legacy
      - name: Save diagnostic output
        if: always()
        run: |
          mkdir -p test-results
          scripts/test-stack logs > test-results/stack.log 2>&1 || true
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-php-${{ matrix.php }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Remove disposable containers and data
        if: always()
        run: scripts/test-stack down
