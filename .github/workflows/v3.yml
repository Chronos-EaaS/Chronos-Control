name: Chronos v3 verification and immutable build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NG_BUILD_MAX_WORKERS: '2'
  NODE_OPTIONS: --max-old-space-size=3072

concurrency:
  group: chronos-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP ${{ matrix.php }} and responsive v3 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    env:
      CHRONOS_TEST_PHP_VERSION: ${{ matrix.php }}
      CHRONOS_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: |
            tests/e2e/package-lock.json
            frontend/package-lock.json
      - name: Install locked development dependencies
        run: |
          npm --prefix tests/e2e ci --ignore-scripts
          npm --prefix frontend ci --ignore-scripts
      - name: Type-check browser contracts and Angular application
        run: |
          npm --prefix tests/e2e run typecheck
          npm --prefix frontend run typecheck
      - name: Validate locked dependencies and check published advisories
        if: matrix.php == '8.3'
        run: |
          npm --prefix tests/e2e audit --audit-level=low
          npm --prefix frontend audit --audit-level=low
          docker run --rm --env COMPOSER_ROOT_VERSION=3.0.x-dev --volume "$GITHUB_WORKSPACE:/app:ro" --workdir /app/backend composer:2 validate --strict --no-check-publish
          docker run --rm --env COMPOSER_ROOT_VERSION=3.0.x-dev --volume "$GITHUB_WORKSPACE:/app:ro" --workdir /app/backend composer:2 audit --locked --no-interaction --format=plain
      - name: Test all Angular components
        if: matrix.php == '8.3'
        run: npm --prefix frontend test
      - name: Build the production Angular UI with the source identity
        run: npm --prefix frontend run build
      - name: Start fixed disposable PHP and MySQL fixtures
        run: tools/test/test-stack-v3 up
      - name: Verify Composer runtime, PHP units and deployment recovery
        run: |
          tools/test/test-stack-v3 php -d allow_url_fopen=0 /opt/chronos/backend/vendor/bin/phpunit --configuration /opt/chronos/backend/phpunit.xml.dist --fail-on-deprecation --fail-on-notice --fail-on-incomplete
          tools/test/test-stack-v3 php -d allow_url_fopen=0 /opt/chronos/backend/tests/integration/runtime-dependencies.php
          tools/test/test-stack-v3 php -d allow_url_fopen=0 /opt/chronos/backend/tests/deployment/release.php
      - name: Verify actual administrative transaction and filesystem recovery
        run: |
          tools/test/test-stack-v3 reset
          tools/test/test-stack-v3 php /opt/chronos/backend/tests/integration/admin-operations.php
          tools/test/test-stack-v3 reset
      - name: Verify actual API, legacy agent and remember-token contracts
        run: |
          python3 tests/api/ui-api.py --base-url http://127.0.0.1:8089 --fixture-project chronos-v3-ui-regression --include-demo-reset
          tools/test/test-stack-v3 reset
          python3 tests/api/ui-unicode.py --base-url http://127.0.0.1:8089 --fixture-project chronos-v3-ui-regression
          tools/test/test-stack-v3 reset
          python3 tests/api/ui-search.py --base-url http://127.0.0.1:8089
          tools/test/test-stack-v3 reset
          python3 tests/api/agent-contracts.py --base-url http://127.0.0.1:8089 --fixture-project chronos-v3-ui-regression
          tools/test/test-stack-v3 reset
          python3 tests/api/zip-downloads.py --base-url http://127.0.0.1:8089
          tools/test/test-stack-v3 reset
      - name: Verify fresh installation on independent MySQL 8
        run: tools/test/test-stack-v3 installer '${{ matrix.php }}'
      - name: Build isolated real Git and Mercurial tests
        run: >-
          docker build --build-arg PHP_VERSION=${{ matrix.php }}
          --file tools/test/docker/repositories.Dockerfile --tag chronos-v3-repository-tests:ci .
      - name: Verify real repository creation, sync, policy and recovery without network
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true chronos-v3-repository-tests:ci
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true chronos-v3-repository-tests:ci --remote-disabled
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true --entrypoint php chronos-v3-repository-tests:ci /opt/chronos/backend/tests/integration/job-transitions.php
      - name: Install desktop and mobile browser engines
        if: matrix.php == '8.3'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify all five desktop and mobile browser projects
        if: matrix.php == '8.3'
        run: |
          tools/test/test-stack-v3 reset
          npm --prefix tests/e2e test
      - name: Save fixture logs
        if: always()
        run: |
          mkdir -p dist/test-results
          tools/test/test-stack-v3 logs > dist/test-results/v3-stack.log 2>&1 || true
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chronos-v3-failure-php-${{ matrix.php }}
          path: |
            dist/test-results/
            dist/playwright-report/
          retention-days: 7
          overwrite: true
      - name: Remove all disposable services and volumes
        if: always()
        run: tools/test/test-stack-v3 down

  package:
    name: Build and test the production package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHRONOS_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the identified production UI
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run build
      - name: Assemble the deployment runtime from backend sources
        run: node tools/build/assemble-runtime.mjs --build-id "$GITHUB_SHA"
      - name: Install only locked production PHP dependencies
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env COMPOSER_HOME=/tmp/composer
          --volume "$GITHUB_WORKSPACE:/app" --workdir /app/dist/runtime composer:2
          install --no-dev --prefer-dist --classmap-authoritative --no-interaction --no-progress --no-scripts --no-plugins
      - name: Test runtime assembly and publishing contracts without GitHub access
        run: node --test tools/build/*.test.mjs tools/release/*.test.mjs tools/test/*.test.mjs
      - name: Build immutable archive, manifest and standalone installer
        run: node tools/release/build-release.mjs
      - name: Install and roll back the actual archive on offline PHP 8.3 and 8.5
        run: |
          git show bb5c6200c553e99d6b76412a9ac556327aa47be7:backend/legacy/libraries/release.php > "$RUNNER_TEMP/chronos-previous-deployer.php"
          git show 6d1f6cb9c6d1d5ccd6b62929efe558ba70f1b70f:backend/src/Infrastructure/Deployment/ReleaseManager.php > "$RUNNER_TEMP/chronos-previous-ui-deployer.php"
          for php_version in 8.3 8.5; do
            docker build --build-arg "PHP_VERSION=$php_version" --target test-runtime --file tools/test/docker/Dockerfile --tag "chronos-v3-package-runtime:$php_version" .
            docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true --volume "$GITHUB_WORKSPACE:/workspace:ro" --volume "$RUNNER_TEMP/chronos-previous-deployer.php:/previous-deployer.php:ro" --volume "$RUNNER_TEMP/chronos-previous-ui-deployer.php:/previous-ui-deployer.php:ro" --env CHRONOS_PREVIOUS_DEPLOYER=/previous-deployer.php --env CHRONOS_PREVIOUS_UI_DEPLOYER=/previous-ui-deployer.php --workdir /workspace --entrypoint php "chronos-v3-package-runtime:$php_version" backend/tests/deployment/package.php --run dist/release
          done
      - name: Upload the verified immutable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chronos-control-${{ github.sha }}
          path: |
            dist/release/chronos-control.zip
            dist/release/chronos-control-manifest.json
            dist/release/chronos-installer.php
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    name: Publish immutable commit package
    needs: package
    if: >-
      github.repository == 'Chronos-EaaS/Chronos-Control' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: chronos-immutable-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - name: Download the verified package from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "chronos-control-$GITHUB_SHA" --dir dist/release
      - name: Publish or verify immutable commit assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/publish-release.mjs dist/release
